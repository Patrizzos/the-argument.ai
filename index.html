<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argument.ai — Argument Mapping Studio</title>
<style>
  /* ===== 1. Tokens ===== */
  :root {
    --bg:            #F7F5EF;
    --surface:       #FFFFFF;
    --ink:           #2C2A24;
    --ink-muted:     #8A8780;
    --border:        #DDD9D0;
    --pro:           #1A3A6B;
    --pro-light:     #EEF2FA;
    --con:           #7A1A1A;
    --con-light:     #FAEEEE;
    --neutral:       #4A4540;
    --neutral-light: #F2EFE8;
    --highlight:     #E8B84B;
    --fallacy:       #C0392B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:            #1C1B17;
      --surface:       #262420;
      --ink:           #EDEAE1;
      --ink-muted:     #948F84;
      --border:        #3A372F;
      --pro-light:     #1E2A42;
      --con-light:     #3A2020;
      --neutral-light: #2C2A24;
    }
  }

  /* ===== 2. Reset & base ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  button:hover { background: var(--neutral-light); }
  button:active { transform: translateY(1px); }
  input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
  }

  /* ===== 3. Layout ===== */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 20;
    flex-shrink: 0;
  }
  #logo {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  #logo .dot { color: var(--highlight); }
  #logo-sub {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 1px;
  }
  #topic-bar {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 0 20px;
  }
  #topic-text {
    font-family: Georgia, serif;
    font-size: 15px;
    color: var(--ink);
    max-width: 640px;
  }
  #sides { display: flex; gap: 8px; flex-shrink: 0; }
  .side-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--neutral-light);
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .side-badge.is-pro { background: var(--pro-light); color: var(--pro); border-color: var(--pro); }
  .side-badge.is-con { background: var(--con-light); color: var(--con); border-color: var(--con); }

  #canvas-container {
    position: relative;
    flex: 1;
    overflow: hidden;
    cursor: grab;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: 0 0;
  }
  #canvas-container.is-panning { cursor: grabbing; }
  #canvas-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 3000px;
    height: 2000px;
    transform-origin: 0 0;
  }
  #edge-svg {
    position: absolute;
    top: 0; left: 0;
    width: 3000px;
    height: 2000px;
    pointer-events: none;
  }
  #node-layer {
    position: absolute;
    top: 0; left: 0;
    width: 3000px;
    height: 2000px;
  }

  #toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    z-index: 20;
    flex-shrink: 0;
  }
  #toolbar-left, #toolbar-right { display: flex; gap: 8px; }
  #toolbar-left button.primary { border-color: var(--ink); }
  #recenter-btn { margin-right: 6px; }

  /* ===== 4. Node card styles ===== */
  .node {
    position: absolute;
    width: 200px;
    border-radius: 8px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.2s, opacity 0.2s;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .node:active { cursor: grabbing; }
  .node-side-pro { background: var(--pro-light); border-color: var(--pro); }
  .node-side-con { background: var(--con-light); border-color: var(--con); }
  .node-side-neutral { background: var(--neutral-light); border-color: var(--border); }

  .node-strength-1 { opacity: 0.45; border-style: dashed; }
  .node-strength-2 { opacity: 0.65; border-style: dashed; }
  .node-strength-3 { opacity: 0.85; }
  .node-strength-4 { opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.10); }
  .node-strength-5 { opacity: 1; box-shadow: 0 0 0 2px currentColor, 0 2px 12px rgba(0,0,0,0.15); }

  .node-highlighted { box-shadow: 0 0 0 3px var(--highlight), 0 0 20px rgba(232,184,75,0.35) !important; }

  .node-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .node-icon { font-size: 12px; line-height: 1; }
  .node-author { margin-left: 2px; font-size: 11px; }
  .node-strength-dots { margin-left: auto; letter-spacing: -1px; color: var(--ink-muted); font-size: 10px; }
  .node-body {
    padding: 8px;
    line-height: 1.5;
    color: var(--ink);
    max-height: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  .fallacy-badge {
    display: inline-block;
    background: var(--fallacy);
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px 2px 6px;
    border-radius: 3px;
    margin: 0 8px 8px;
    clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 50%, calc(100% - 4px) 100%, 0 100%);
    cursor: help;
  }
  .highlight-callout {
    margin: 0 8px 8px;
    padding: 6px 8px;
    background: rgba(232,184,75,0.18);
    border-left: 2px solid var(--highlight);
    font-size: 11px;
    font-style: italic;
    color: var(--ink);
    border-radius: 0 4px 4px 0;
  }
  .node-id-tag {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    color: var(--ink-muted);
    opacity: 0;
    padding: 0 8px 6px;
    transition: opacity 0.15s;
  }
  .node:hover .node-id-tag { opacity: 0.7; }

  /* ===== 5. SVG edge styles ===== */
  .edge { fill: none; stroke-width: 1.5; }
  .edge-supports   { stroke: #2D6A4F; }
  .edge-objects_to { stroke: #C0392B; stroke-dasharray: 4 3; }
  .edge-rebuts     { stroke: #E8B84B; stroke-dasharray: 2 2; }
  .edge-qualifies  { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 1 3; }

  /* ===== 6. Modal / tooltip ===== */
  #modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(44,42,36,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #modal-backdrop[hidden] { display: none; }
  #add-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  #add-modal h3 { margin: 0 0 14px; font-family: Georgia, serif; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 5px; }
  .field input[type="text"], .field textarea, .field select { width: 100%; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  #strength-value { font-weight: 700; margin-left: 6px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* ===== 7. Empty state ===== */
  #empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--ink-muted);
    font-family: Georgia, serif;
    font-size: 14px;
    max-width: 360px;
    pointer-events: none;
  }
  #empty-state .big { font-size: 34px; display: block; margin-bottom: 10px; }

  /* ===== 8. Toast ===== */
  #toast {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    max-width: 80vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- Header -->
  <header id="header">
    <div id="logo">Argument<span class="dot">.ai</span><span id="logo-sub">Argument Mapping Studio</span></div>
    <div id="topic-bar">
      <span id="topic-text">Start a debate — ask the agent to set a topic</span>
    </div>
    <div id="sides">
      <span id="user-side-badge" class="side-badge">You: —</span>
      <span id="agent-side-badge" class="side-badge">Agent: —</span>
    </div>
  </header>

  <!-- Canvas area -->
  <div id="canvas-container">
    <div id="canvas-inner">
      <svg id="edge-svg">
        <defs>
          <marker id="arrow-supports" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#2D6A4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-objects_to" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-rebuts" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#E8B84B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-qualifies" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8780" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g id="edge-layer"></g>
      </svg>
      <div id="node-layer"></div>
    </div>
    <div id="empty-state">
      <span class="big">◈</span>
      Open this page in an agent that supports WebMCP, or use the toolbar below,<br>to start mapping an argument.
    </div>
  </div>

  <!-- Bottom toolbar -->
  <div id="toolbar">
    <div id="toolbar-left">
      <button class="primary" onclick="promptAddNode('claim')">+ Claim</button>
      <button onclick="promptAddNode('support')">+ Support</button>
      <button onclick="promptAddNode('objection')">+ Object</button>
    </div>
    <div id="toolbar-right">
      <button id="recenter-btn" onclick="recenterCanvas()">Recenter</button>
      <button onclick="undo()">Undo</button>
      <button onclick="confirmClear()">Clear</button>
    </div>
  </div>

  <!-- Add node modal -->
  <div id="modal-backdrop" hidden>
    <div id="add-modal">
      <h3 id="modal-title">Add Claim</h3>
      <div class="field" id="target-field" hidden>
        <label for="target-select">Target node</label>
        <select id="target-select"></select>
      </div>
      <div class="field">
        <label for="text-input">Text</label>
        <textarea id="text-input" maxlength="500" placeholder="1–2 sentences max"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="side-select">Side</label>
          <select id="side-select">
            <option value="pro">Pro</option>
            <option value="con">Con</option>
            <option value="neutral">Neutral</option>
          </select>
        </div>
        <div class="field">
          <label for="strength-input">Strength <span id="strength-value">3</span></label>
          <input type="range" id="strength-input" min="1" max="5" value="3" step="1">
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="submitModal()">Add</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';

  // === 1. CONSTANTS ===
  var CANVAS_W = 3000;
  var CANVAS_H = 2000;
  var STORAGE_KEY = 'argumentai_state';
  var NODE_ICONS = { claim: '◈', support: '↑', objection: '✕', rebuttal: '↩', caveat: '⚠' };

  // === 2. STATE ===
  var state = {
    topic: '',
    nodes: [],
    edges: [],
    history: [],
    agentSide: null,
    userSide: null,
    selectedNodeId: null
  };

  // Pan state
  var pan = { x: 0, y: 0 };
  var isPanning = false;
  var panStart = { x: 0, y: 0, px: 0, py: 0 };
  var isDraggingNode = false;

  // === 3. HELPERS ===
  function nanoid(n) {
    n = n || 8;
    var alphabet = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var bytes = crypto.getRandomValues(new Uint8Array(n));
    var out = '';
    for (var i = 0; i < n; i++) out += alphabet[bytes[i] % alphabet.length];
    return out;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function clampStrength(s) {
    s = Number(s);
    if (isNaN(s)) s = 3;
    return Math.max(1, Math.min(5, Math.round(s)));
  }

  function createNode(type, text, author, side, strength) {
    var angle = (state.nodes.length * 137.5) * Math.PI / 180; // golden angle
    var radius = 120 + state.nodes.length * 15;
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    var node = {
      id: nanoid(),
      type: type,
      text: String(text || '').slice(0, 500),
      author: author,
      side: side || 'neutral',
      strength: clampStrength(strength == null ? 3 : strength),
      fallacy: null,
      fallacyExplanation: null,
      highlighted: false,
      highlightMessage: null,
      ratingReason: null,
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius,
      createdAt: Date.now()
    };
    state.nodes.push(node);
    return node;
  }

  function createEdge(fromId, toId, type) {
    var edge = { id: nanoid(), from: fromId, to: toId, type: type };
    state.edges.push(edge);
    return edge;
  }

  function pushHistory(action) {
    state.history.push({
      action: action,
      snapshot: JSON.parse(JSON.stringify({ nodes: state.nodes, edges: state.edges })),
      timestamp: Date.now()
    });
    if (state.history.length > 50) state.history.shift();
  }

  function undo() {
    var entry = state.history.pop();
    if (!entry) { showToast('Nothing to undo'); return; }
    state.nodes = entry.snapshot.nodes;
    state.edges = entry.snapshot.edges;
    renderGraph();
    saveState();
    showToast('Undid: ' + entry.action);
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable — continue in-memory */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        Object.assign(state, parsed);
      }
    } catch (e) { /* corrupt or unavailable — start fresh */ }
  }

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  // === 4. RENDER ===
  function renderTopicBar() {
    var topicEl = document.getElementById('topic-text');
    topicEl.textContent = state.topic
      ? state.topic
      : 'Start a debate — ask the agent to set a topic';

    var userBadge = document.getElementById('user-side-badge');
    var agentBadge = document.getElementById('agent-side-badge');

    userBadge.textContent = 'You: ' + (state.userSide ? capitalize(state.userSide) : '—');
    agentBadge.textContent = 'Agent: ' + (state.agentSide ? capitalize(state.agentSide) : '—');

    userBadge.className = 'side-badge' + sideClass(state.userSide);
    agentBadge.className = 'side-badge' + sideClass(state.agentSide);
  }

  function sideClass(side) {
    if (side === 'pro') return ' is-pro';
    if (side === 'con') return ' is-con';
    return '';
  }

  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function renderGraph() {
    renderEdges();
    renderNodes();
    renderTopicBar();
    document.getElementById('empty-state').style.display = state.nodes.length ? 'none' : 'block';
    refreshTargetOptions();
  }

  function renderEdges() {
    var layer = document.getElementById('edge-layer');
    layer.innerHTML = '';
    for (var i = 0; i < state.edges.length; i++) {
      var edge = state.edges[i];
      var from = findNode(edge.from);
      var to = findNode(edge.to);
      if (!from || !to) continue;
      var x1 = from.x + 100, y1 = from.y + 40;
      var x2 = to.x + 100, y2 = to.y + 40;
      var mx = (x1 + x2) / 2;
      var cp1x = x1 + (mx - x1) * 0.5;
      var cp2x = x2 - (x2 - mx) * 0.5;
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + cp1x + ',' + y1 + ' ' + cp2x + ',' + y2 + ' ' + x2 + ',' + y2);
      path.setAttribute('class', 'edge edge-' + edge.type);
      path.setAttribute('marker-end', 'url(#arrow-' + edge.type + ')');
      layer.appendChild(path);
    }
  }

  function renderNodes() {
    var layer = document.getElementById('node-layer');
    layer.innerHTML = '';
    for (var i = 0; i < state.nodes.length; i++) {
      var node = state.nodes[i];
      var el = document.createElement('div');
      el.className = 'node node-' + node.type + ' node-side-' + node.side + ' node-strength-' + node.strength +
        (node.highlighted ? ' node-highlighted' : '');
      el.id = 'node-' + node.id;
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      el.dataset.nodeId = node.id;

      var fallacyHtml = node.fallacy
        ? '<div class="fallacy-badge" title="' + escapeHtml(node.fallacyExplanation || '') + '">' + escapeHtml(node.fallacy) + '</div>'
        : '';
      var highlightHtml = (node.highlighted && node.highlightMessage)
        ? '<div class="highlight-callout">' + escapeHtml(node.highlightMessage) + '</div>'
        : '';

      el.innerHTML =
        '<div class="node-header">' +
          '<span class="node-icon">' + (NODE_ICONS[node.type] || '●') + '</span>' +
          '<span class="node-type-label">' + escapeHtml(node.type) + '</span>' +
          '<span class="node-author">' + (node.author === 'agent' ? '\uD83E\uDD16' : '\uD83D\uDC64') + '</span>' +
          '<span class="node-strength-dots">' + strengthDots(node.strength) + '</span>' +
        '</div>' +
        '<div class="node-body">' + escapeHtml(node.text) + '</div>' +
        fallacyHtml +
        highlightHtml +
        '<div class="node-id-tag">' + node.id + '</div>';

      el.addEventListener('mousedown', startDrag(node));
      layer.appendChild(el);
    }
  }

  function strengthDots(s) { return '\u25CF'.repeat(s) + '\u25CB'.repeat(5 - s); }

  function findNode(id) {
    for (var i = 0; i < state.nodes.length; i++) if (state.nodes[i].id === id) return state.nodes[i];
    return null;
  }

  // === 5. INTERACTIONS ===

  // Node drag-and-drop
  function startDrag(node) {
    return function (e) {
      if (e.target.closest('button')) return;
      e.preventDefault();
      e.stopPropagation();
      isDraggingNode = true;
      var startX = e.clientX - node.x * getScale();
      var startY = e.clientY - node.y * getScale();

      function onMove(e) {
        node.x = (e.clientX - startX) / getScale();
        node.y = (e.clientY - startY) / getScale();
        var el = document.getElementById('node-' + node.id);
        if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
        renderEdges();
      }
      function onUp() {
        isDraggingNode = false;
        saveState();
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  }

  function getScale() { return 1; } // reserved for future zoom support

  // Canvas pan
  function initPan() {
    var container = document.getElementById('canvas-container');
    container.addEventListener('mousedown', function (e) {
      if (isDraggingNode) return;
      if (e.target.closest('.node')) return;
      isPanning = true;
      container.classList.add('is-panning');
      panStart.x = e.clientX;
      panStart.y = e.clientY;
      panStart.px = pan.x;
      panStart.py = pan.y;
    });
    window.addEventListener('mousemove', function (e) {
      if (!isPanning) return;
      pan.x = panStart.px + (e.clientX - panStart.x);
      pan.y = panStart.py + (e.clientY - panStart.y);
      applyPan();
    });
    window.addEventListener('mouseup', function () {
      isPanning = false;
      container.classList.remove('is-panning');
    });
  }

  function applyPan() {
    var inner = document.getElementById('canvas-inner');
    inner.style.transform = 'translate(' + pan.x + 'px,' + pan.y + 'px)';
  }

  function recenterCanvas() {
    var container = document.getElementById('canvas-container');
    var rect = container.getBoundingClientRect();
    if (state.nodes.length === 0) {
      pan.x = rect.width / 2 - CANVAS_W / 2 / 3;
      pan.y = rect.height / 2 - CANVAS_H / 2 / 3;
    } else {
      var sumX = 0, sumY = 0;
      state.nodes.forEach(function (n) { sumX += n.x; sumY += n.y; });
      var cx = sumX / state.nodes.length;
      var cy = sumY / state.nodes.length;
      pan.x = rect.width / 2 - cx;
      pan.y = rect.height / 2 - cy;
    }
    applyPan();
  }

  // === Modal (manual add) ===
  var modalMode = null; // 'claim' | 'support' | 'objection'

  function promptAddNode(type) {
    modalMode = type;
    var titleMap = { claim: 'Add Claim', support: 'Add Support', objection: 'Add Objection' };
    document.getElementById('modal-title').textContent = titleMap[type] || 'Add Node';
    document.getElementById('text-input').value = '';
    document.getElementById('side-select').value = 'neutral';
    document.getElementById('strength-input').value = 3;
    document.getElementById('strength-value').textContent = '3';

    var targetField = document.getElementById('target-field');
    if (type === 'claim') {
      targetField.hidden = true;
    } else {
      targetField.hidden = false;
      refreshTargetOptions();
    }
    document.getElementById('modal-backdrop').hidden = false;
    document.getElementById('text-input').focus();
  }

  function refreshTargetOptions() {
    var sel = document.getElementById('target-select');
    if (!sel) return;
    var prevValue = sel.value;
    sel.innerHTML = '';
    state.nodes.forEach(function (n) {
      var opt = document.createElement('option');
      opt.value = n.id;
      opt.textContent = '[' + n.type + '] ' + n.text.slice(0, 40) + (n.text.length > 40 ? '…' : '');
      sel.appendChild(opt);
    });
    if (prevValue) sel.value = prevValue;
  }

  function closeModal() {
    document.getElementById('modal-backdrop').hidden = true;
    modalMode = null;
  }

  function submitModal() {
    var text = document.getElementById('text-input').value.trim();
    var side = document.getElementById('side-select').value;
    var strength = clampStrength(document.getElementById('strength-input').value);
    if (!text) { showToast('Enter some text first'); return; }

    if (modalMode === 'claim') {
      var node = createNode('claim', text, 'user', side, strength);
      pushHistory('add_claim (user)');
    } else if (modalMode === 'support') {
      var targetId = document.getElementById('target-select').value;
      if (!targetId) { showToast('No target node available — add a claim first'); return; }
      var n = createNode('support', text, 'user', side, strength);
      createEdge(n.id, targetId, 'supports');
      pushHistory('add_support (user)');
    } else if (modalMode === 'objection') {
      var targetId2 = document.getElementById('target-select').value;
      if (!targetId2) { showToast('No target node available — add a claim first'); return; }
      var n2 = createNode('objection', text, 'user', side, strength);
      createEdge(n2.id, targetId2, 'objects_to');
      pushHistory('add_objection (user)');
    }
    renderGraph();
    saveState();
    closeModal();
  }

  function confirmClear() {
    if (state.nodes.length === 0 && state.edges.length === 0) { showToast('Canvas is already empty'); return; }
    if (window.confirm('Clear the entire argument map? This cannot be undone via the Undo button once confirmed.')) {
      pushHistory('clear_map (user)');
      state.nodes = [];
      state.edges = [];
      renderGraph();
      saveState();
      showToast('Map cleared');
    }
  }

  document.getElementById('modal-backdrop').addEventListener('click', function (e) {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  document.getElementById('strength-input').addEventListener('input', function (e) {
    document.getElementById('strength-value').textContent = e.target.value;
  });

  // Expose handlers used by inline onclick attributes
  window.promptAddNode = promptAddNode;
  window.closeModal = closeModal;
  window.submitModal = submitModal;
  window.confirmClear = confirmClear;
  window.undo = undo;
  window.recenterCanvas = recenterCanvas;

  // === 6. WEBMCP TOOLS ===
  function serializeNode(n) {
    return {
      id: n.id, type: n.type, text: n.text,
      author: n.author, side: n.side, strength: n.strength,
      fallacy: n.fallacy || null, highlighted: n.highlighted
    };
  }

  async function registerWebMCPTools() {
    if (typeof document.modelContext?.registerTool !== 'function') {
      console.log('WebMCP not available — running in non-agent mode');
      return;
    }

    await document.modelContext.registerTool({
      name: 'get_map_state',
      description: 'Returns the current argument map: all nodes (claims, supports, objections, rebuttals), edges connecting them, and metadata about the debate topic and sides. Call this first to orient yourself before making changes.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: async function () {
        return {
          topic: state.topic,
          agentSide: state.agentSide,
          userSide: state.userSide,
          nodeCount: state.nodes.length,
          nodes: state.nodes.map(serializeNode),
          edges: state.edges.map(function (e) { return { id: e.id, from: e.from, to: e.to, type: e.type }; })
        };
      }
    });

    await document.modelContext.registerTool({
      name: 'get_node',
      description: 'Get full details of a specific argument node, including what it connects to and from.',
      inputSchema: {
        type: 'object',
        properties: { node_id: { type: 'string', description: 'The ID of the node to retrieve' } },
        required: ['node_id'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: async function (args) {
        var node = findNode(args.node_id);
        if (!node) return { error: 'Node ' + args.node_id + ' not found' };
        var incoming = state.edges.filter(function (e) { return e.to === args.node_id; })
          .map(function (e) { return Object.assign({}, e, { node: findNode(e.from) }); });
        var outgoing = state.edges.filter(function (e) { return e.from === args.node_id; })
          .map(function (e) { return Object.assign({}, e, { node: findNode(e.to) }); });
        return { node: node, incoming: incoming, outgoing: outgoing };
      }
    });

    await document.modelContext.registerTool({
      name: 'get_weak_points',
      description: 'Analyse the argument map and return nodes that are logically weak, unevidenced, or that contain logical fallacies. Use this to decide where to focus your objections.',
      inputSchema: {
        type: 'object',
        properties: {
          side: { type: 'string', enum: ['pro', 'con', 'all'], description: 'Which side to analyse. Default: all' }
        },
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: async function (args) {
        var side = (args && args.side) || 'all';
        var targets = state.nodes.filter(function (n) {
          return (side === 'all' || n.side === side) && (n.strength <= 2 || n.fallacy);
        });
        return {
          count: targets.length,
          weakNodes: targets.map(function (n) {
            return { id: n.id, text: n.text, strength: n.strength, fallacy: n.fallacy || null, type: n.type };
          })
        };
      }
    });

    await document.modelContext.registerTool({
      name: 'add_claim',
      description: 'Add a new claim (assertion) to the argument map. Use for root positions or standalone propositions not yet connected to other nodes. Claims are the building blocks — supports and objections attach to them.',
      inputSchema: {
        type: 'object',
        properties: {
          text: { type: 'string', description: "The claim text. Be concise — 1–2 sentences max." },
          side: { type: 'string', enum: ['pro', 'con', 'neutral'], description: 'Which side of the debate this claim belongs to.' },
          strength: { type: 'number', description: "Your assessment of the claim's logical strength: 1 (very weak) to 5 (very strong).", minimum: 1, maximum: 5 }
        },
        required: ['text', 'side', 'strength'],
        additionalProperties: false
      },
      execute: async function (args) {
        var node = createNode('claim', args.text, 'agent', args.side, args.strength);
        pushHistory('add_claim');
        renderGraph();
        saveState();
        return { id: node.id, message: 'Claim added: "' + node.text + '"' };
      }
    });

    await document.modelContext.registerTool({
      name: 'add_support',
      description: 'Add a supporting argument or piece of evidence for an existing node. Creates the node and draws a "supports" edge from it to the target.',
      inputSchema: {
        type: 'object',
        properties: {
          text: { type: 'string', description: 'The supporting argument or evidence.' },
          supports_id: { type: 'string', description: 'ID of the node this supports.' },
          side: { type: 'string', enum: ['pro', 'con', 'neutral'] },
          strength: { type: 'number', minimum: 1, maximum: 5 }
        },
        required: ['text', 'supports_id', 'side', 'strength'],
        additionalProperties: false
      },
      execute: async function (args) {
        var target = findNode(args.supports_id);
        if (!target) return { error: 'Node ' + args.supports_id + ' not found' };
        var node = createNode('support', args.text, 'agent', args.side, args.strength);
        createEdge(node.id, args.supports_id, 'supports');
        pushHistory('add_support');
        renderGraph();
        saveState();
        return { id: node.id, message: 'Support added for "' + target.text.slice(0, 40) + '..."' };
      }
    });

    await document.modelContext.registerTool({
      name: 'add_objection',
      description: "Add an objection challenging an existing claim or argument. Creates the node and draws an \"objects_to\" edge from it to the target. This is your primary tool for challenging the user's arguments.",
      inputSchema: {
        type: 'object',
        properties: {
          text: { type: 'string', description: 'The objection. Be specific — name the exact flaw.' },
          objects_to_id: { type: 'string', description: 'ID of the node being objected to.' },
          side: { type: 'string', enum: ['pro', 'con', 'neutral'] },
          strength: { type: 'number', minimum: 1, maximum: 5 },
          fallacy: { type: 'string', description: 'Optional: if the targeted node contains a logical fallacy, name it here (e.g. "ad hominem", "straw man", "false dichotomy", "appeal to authority", "slippery slope").' }
        },
        required: ['text', 'objects_to_id', 'side', 'strength'],
        additionalProperties: false
      },
      execute: async function (args) {
        var target = findNode(args.objects_to_id);
        if (!target) return { error: 'Node ' + args.objects_to_id + ' not found' };
        var node = createNode('objection', args.text, 'agent', args.side, args.strength);
        if (args.fallacy) {
          node.fallacy = args.fallacy;
          target.fallacy = args.fallacy;
        }
        createEdge(node.id, args.objects_to_id, 'objects_to');
        pushHistory('add_objection');
        renderGraph();
        saveState();
        return { id: node.id, message: 'Objection added' + (args.fallacy ? ' (' + args.fallacy + ')' : '') };
      }
    });

    await document.modelContext.registerTool({
      name: 'add_rebuttal',
      description: 'Add a rebuttal that directly responds to an objection or counter-argument. Creates a "rebuts" edge. Use this to defend a position after the other side has objected.',
      inputSchema: {
        type: 'object',
        properties: {
          text: { type: 'string', description: 'The rebuttal.' },
          rebuts_id: { type: 'string', description: 'ID of the objection being rebutted.' },
          side: { type: 'string', enum: ['pro', 'con', 'neutral'] },
          strength: { type: 'number', minimum: 1, maximum: 5 }
        },
        required: ['text', 'rebuts_id', 'side', 'strength'],
        additionalProperties: false
      },
      execute: async function (args) {
        var target = findNode(args.rebuts_id);
        if (!target) return { error: 'Node ' + args.rebuts_id + ' not found' };
        var node = createNode('rebuttal', args.text, 'agent', args.side, args.strength);
        createEdge(node.id, args.rebuts_id, 'rebuts');
        pushHistory('add_rebuttal');
        renderGraph();
        saveState();
        return { id: node.id, message: 'Rebuttal added' };
      }
    });

    await document.modelContext.registerTool({
      name: 'rate_node',
      description: "Update the strength rating of an argument node. Use after you've considered new evidence or after the argument has evolved. Lower ratings appear visually weaker on the canvas.",
      inputSchema: {
        type: 'object',
        properties: {
          node_id: { type: 'string' },
          strength: { type: 'number', minimum: 1, maximum: 5, description: '1 = very weak / easily defeated, 5 = very strong / near-irrefutable' },
          reason: { type: 'string', description: "Why you're changing the rating. Shown as a tooltip." }
        },
        required: ['node_id', 'strength'],
        additionalProperties: false
      },
      execute: async function (args) {
        var node = findNode(args.node_id);
        if (!node) return { error: 'Node ' + args.node_id + ' not found' };
        var old = node.strength;
        node.strength = clampStrength(args.strength);
        if (args.reason) node.ratingReason = args.reason;
        pushHistory('rate_node');
        renderGraph();
        saveState();
        return { message: 'Strength updated ' + old + ' \u2192 ' + node.strength };
      }
    });

    await document.modelContext.registerTool({
      name: 'highlight_node',
      description: "Highlight a specific node on the canvas to draw the user's attention to it — useful when you're about to object to it or want to discuss it. Pass null to clear all highlights.",
      inputSchema: {
        type: 'object',
        properties: {
          node_id: { type: ['string', 'null'], description: 'ID of node to highlight, or null to clear.' },
          message: { type: 'string', description: 'Optional: message to display in a callout near the highlighted node.' }
        },
        additionalProperties: false
      },
      execute: async function (args) {
        state.nodes.forEach(function (n) { n.highlighted = false; n.highlightMessage = null; });
        var nodeId = args ? args.node_id : null;
        if (nodeId) {
          var node = findNode(nodeId);
          if (!node) return { error: 'Node ' + nodeId + ' not found' };
          node.highlighted = true;
          if (args.message) node.highlightMessage = args.message;
        }
        renderGraph();
        saveState();
        return { message: nodeId ? 'Node highlighted' : 'Highlights cleared' };
      }
    });

    await document.modelContext.registerTool({
      name: 'flag_fallacy',
      description: 'Flag a node as containing a specific logical fallacy. The node will be visually marked on the canvas. Use precise fallacy names.',
      inputSchema: {
        type: 'object',
        properties: {
          node_id: { type: 'string' },
          fallacy: { type: 'string', description: 'Name of the logical fallacy. Common ones: ad hominem, straw man, false dichotomy, slippery slope, appeal to authority, circular reasoning, hasty generalisation, red herring, tu quoque, post hoc, burden of proof.' },
          explanation: { type: 'string', description: 'Brief explanation of why this fallacy applies here.' }
        },
        required: ['node_id', 'fallacy'],
        additionalProperties: false
      },
      execute: async function (args) {
        var node = findNode(args.node_id);
        if (!node) return { error: 'Node ' + args.node_id + ' not found' };
        node.fallacy = args.fallacy;
        if (args.explanation) node.fallacyExplanation = args.explanation;
        renderGraph();
        saveState();
        return { message: 'Fallacy "' + args.fallacy + '" flagged on node "' + node.text.slice(0, 40) + '..."' };
      }
    });

    await document.modelContext.registerTool({
      name: 'set_topic',
      description: 'Set or update the debate topic displayed at the top of the canvas. Use this at the start of a session to frame the argument.',
      inputSchema: {
        type: 'object',
        properties: {
          topic: { type: 'string', description: 'The debate topic or question. E.g. "Should AI-generated content require disclosure?"' },
          agent_side: { type: 'string', enum: ['pro', 'con'], description: 'Which side the agent will argue. The user will argue the other side.' }
        },
        required: ['topic', 'agent_side'],
        additionalProperties: false
      },
      execute: async function (args) {
        state.topic = args.topic;
        state.agentSide = args.agent_side;
        state.userSide = args.agent_side === 'pro' ? 'con' : 'pro';
        renderTopicBar();
        saveState();
        return { message: 'Topic set. Agent argues: ' + args.agent_side + '. User argues: ' + state.userSide + '.' };
      }
    });

    await document.modelContext.registerTool({
      name: 'clear_map',
      description: 'Clear all nodes and edges from the canvas, starting fresh. The topic is preserved. Use with caution — this cannot be undone.',
      inputSchema: {
        type: 'object',
        properties: { confirm: { type: 'boolean', description: 'Must be true to confirm the clear.' } },
        required: ['confirm'],
        additionalProperties: false
      },
      execute: async function (args) {
        if (!args.confirm) return { error: 'Pass confirm: true to clear the map.' };
        state.nodes = [];
        state.edges = [];
        state.history = [];
        renderGraph();
        saveState();
        return { message: 'Map cleared.' };
      }
    });

    console.log('Argument.ai: 12 WebMCP tools registered.');
  }

  // === 7. INIT ===
  loadState();
  initPan();
  renderGraph();
  recenterCanvas();
  registerWebMCPTools();
})();
</script>
</body>
</html>
